S4PL-00416EU:
    Hardware: Shelly
    Protocol: 'Gen 2'
    InfoURL:
        - ["/rpc/Switch.GetStatus?id=0", "noch wat"]
        - ["/rpc/Switch.GetStatus?id=1", "noch wat"]
        - ["/rpc/Switch.GetStatus?id=2", "noch wat"]
        - ["/rpc/Switch.GetStatus?id=3", "noch wat"]


SNSW-001X16EU:
    Hardware: Shelly
    Protocol: 'Gen 2'
    InfoURL: ['rpc/Shelly.GetDeviceInfo']

S3PM-001PCEU16:
    Hardware: Shelly
    Protocol: 'Gen 2'
    InfoURL: ['rpc/Shelly.GetDeviceInfo']

SHPLG2-1:
    Hardware: Shelly
    Protocol: 'Gen 1'
    InfoURL:    
        power: meter/0
        counters: meter/0
        total: meter/0
        device:
            type: settings
            hostname: settings
            mac: settings

SNPL-00112EU:
    Hardware: Shelly
    Protocol: 'Gen 2'
    InfoURL: ['rpc/Shelly.GetDeviceInfo']


DS1820:
    Hardware: DS1820
    Protocol: '1-Wire'
    InfoURL: ['info']

ToF:
    Hardware: ToF
    Protocol: 'I2C'
    InfoURL: ['info']

Switch:
    Hardware: Switch
    Protocol: 'Generic'
    InfoURL: ['info']